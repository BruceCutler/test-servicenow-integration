name: PR Review Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AGENT_RUNTIME_ARN: ${{ secrets.AGENT_RUNTIME_ARN }}
  AWS_GITHUB_ROLE_ARN: ${{ secrets.AWS_GITHUB_ROLE_ARN }}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      id-token: write  # required for OIDC authentication

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install latest AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Invoke PR Review Agent
        env:
          AGENT_RUNTIME_ARN: ${{ env.AGENT_RUNTIME_ARN }}
        run: |
          PAYLOAD=$(jq -cn \
            --arg owner "${{ github.repository_owner }}" \
            --arg repo "${{ github.event.repository.name }}" \
            --argjson pr_number ${{ github.event.pull_request.number }} \
            '{owner: $owner, repo: $repo, pr_number: $pr_number}' \
            | base64 -w 0)
          SESSION_ID="pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}-${{ github.run_attempt }}-$(openssl rand -hex 12)"
          
          if [[ -z "$AGENT_RUNTIME_ARN" ]]; then
            echo "::error::AGENT_RUNTIME_ARN is not set"
            exit 1
          fi

          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn "$AGENT_RUNTIME_ARN" \
            --payload "$PAYLOAD" \
            --runtime-session-id "$SESSION_ID" \
            --region ${{ env.AWS_REGION }} \
            "$RESPONSE_FILE"

          cat "$RESPONSE_FILE"

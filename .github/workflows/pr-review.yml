name: PR Review Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AGENT_RUNTIME_ID: ${{ secrets.AGENT_RUNTIME_ID }}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      id-token: write  # required for OIDC authentication

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: us-east-1
      
      - name: Install latest AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Invoke PR Review Agent
        run: |
          PAYLOAD=$(jq -cn \
            --arg owner "${{ github.repository_owner }}" \
            --arg repo "${{ github.event.repository.name }}" \
            --argjson pr_number ${{ github.event.pull_request.number }} \
            '{owner: $owner, repo: $repo, pr_number: $pr_number}' \
            | base64 -w 0)
          SESSION_ID="pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}-${{ github.run_attempt }}-$(openssl rand -hex 12)"
          aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn ${{ env.AGENT_RUNTIME_ARN }} \
            --payload "$PAYLOAD" \
            --runtime-session-id "$SESSION_ID" \
            --region us-east-1 \
            /tmp/response.json
          cat /tmp/response.json

name: PR Review Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      id-token: write  # required for OIDC authentication

    steps:
      - name: Configure AWS Credentials
        # v6.1.0
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install latest AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Invoke PR Review Agent
        timeout-minutes: 10
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME:  ${{ github.event.repository.name }}
          RUN_ID:     ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENT_RUNTIME_ARN: ${{ secrets.AGENT_RUNTIME_ARN }}
        run: |
          PAYLOAD=$(jq -cn \
            --arg  owner  "$REPO_OWNER" \
            --arg  repo   "$REPO_NAME" \
            --argjson pr_number "$PR_NUMBER" \
            '{owner: $owner, repo: $repo, pr_number: $pr_number}' \
            | base64 -w 0)
          SESSION_ID="pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}-${{ github.run_attempt }}-$(openssl rand -hex 12)"
          
          if [[ -z "$AGENT_RUNTIME_ARN" ]]; then
            echo "::error::AGENT_RUNTIME_ARN is not set"
            exit 1
          fi

          # Increase CLI read timeout to 300 seconds
          aws configure set default.cli_read_timeout 300
          aws configure set default.cli_connect_timeout 60

          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn "$AGENT_RUNTIME_ARN" \
            --payload "$PAYLOAD" \
            --runtime-session-id "$SESSION_ID" \
            "$RESPONSE_FILE"

          cat "$RESPONSE_FILE"

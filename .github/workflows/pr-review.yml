name: PR Review Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      id-token: write  # required for OIDC authentication

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::175919345637:role/GitHubActionsRole
          aws-region: us-east-1
      
      - name: Install latest AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Invoke PR Review Agent
        run: |
          PAYLOAD=$(echo -n '{"owner": "${{ github.repository_owner }}", "repo": "${{ github.event.repository.name }}", "pr_number": ${{ github.event.pull_request.number }}}' | base64 -w 0)
          SESSION_ID="pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}-${{ github.run_attempt }}-0123456789012345"
          aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn arn:aws:bedrock-agentcore:us-east-1:175919345637:runtime/PRReviewAgent_PRReviewAgent-72jBH4Ba79 \
            --payload "$PAYLOAD" \
            --runtime-session-id "$SESSION_ID" \
            --region us-east-1 \
            /tmp/response.json
          cat /tmp/response.json
